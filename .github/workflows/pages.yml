name: pages
# Builds the live editor (Vite + Remotion Player) and deploys it to GitHub Pages.
on:
  push:
    branches: [main]
    paths: ['editor/**', 'presets/**', 'ads/sample-ad.json', 'package*.json', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx tsc --noEmit -p .
      - run: npm run editor:build
      # One-time setup by the repo owner: Settings → Pages → Source: "GitHub Actions".
      # (The workflow token is not allowed to create the Pages site itself.)
      - uses: actions/configure-pages@v5
        with: { enablement: true }
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist-editor }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
